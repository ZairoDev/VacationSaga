name: Deploy to VPS (Zero-Downtime)

on:
  # Deploy only after CI succeeds on main (avoids shipping broken builds).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Use Environment secrets (Settings → Environments → Production).
    environment: Production
    # Manual runs always allowed; workflow_run only when CI succeeded.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Verify deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          [ -z "$VPS_HOST" ] && echo "::error::Missing secret VPS_HOST" && missing=1
          [ -z "$VPS_USERNAME" ] && echo "::error::Missing secret VPS_USERNAME" && missing=1
          [ -z "$VPS_SSH_KEY" ] && echo "::error::Missing secret VPS_SSH_KEY" && missing=1
          exit $missing

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Starting deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            DEPLOY_DIR="/var/www/vacationsaga"
            NEW_BUILD_DIR="/var/www/vacationsaga_new_build"
            TEMP_OLD="${DEPLOY_DIR}_old"
            PM2_APP_NAME="vacationsaga"
            APP_PORT=3002
            REPO_URL="https://github.com/ZairoDev/VacationSaga.git"
            DEPLOY_BRANCH="main"

            # Robust delete: chmod then rm -rf; never abort the script on cleanup alone.
            safe_rm() {
              local target="$1"
              if [ ! -e "${target}" ]; then
                return 0
              fi
              sudo chmod -R u+w "${target}" 2>/dev/null || true
              sudo rm -rf "${target}" 2>/dev/null || true
              if [ -e "${target}" ]; then
                echo "WARN: could not fully remove ${target}; forcing with find"
                sudo find "${target}" -mindepth 1 -delete 2>/dev/null || true
                sudo rm -rf "${target}" 2>/dev/null || true
              fi
              if [ -e "${target}" ]; then
                echo "WARN: ${target} still exists after cleanup"
              fi
            }

            fail_and_cleanup() {
              local msg="$1"
              echo "::error::${msg}"
              safe_rm "${NEW_BUILD_DIR}"
              exit 1
            }

            echo "Current status:"
            pm2 list | grep "${PM2_APP_NAME}" || echo "App not running"

            echo ""
            echo "Preparing new build..."
            safe_rm "${NEW_BUILD_DIR}"
            sudo mkdir -p "${NEW_BUILD_DIR}"
            sudo chown -R jenkins:jenkins "${NEW_BUILD_DIR}"

            cd "${NEW_BUILD_DIR}"
            git clone --depth 1 --branch "${DEPLOY_BRANCH}" "${REPO_URL}" .
            sudo chown -R jenkins:jenkins "${NEW_BUILD_DIR}"

            if [ -f "${DEPLOY_DIR}/.env.production" ]; then
              cp "${DEPLOY_DIR}/.env.production" .
            fi
            if [ -f "${DEPLOY_DIR}/.env.local" ]; then
              cp "${DEPLOY_DIR}/.env.local" .
            fi
            if [ ! -f ".env.local" ] && [ -f ".env.production" ]; then
              cp .env.production .env.local
            fi

            echo ""
            echo "Installing dependencies..."
            npm ci || fail_and_cleanup "Install failed (npm ci)"

            echo ""
            echo "Building..."
            export NEXT_TELEMETRY_DISABLED=1
            sudo rm -rf .next
            # Keep full build logs; on failure print a clear marker before cleanup.
            if ! npm run build; then
              fail_and_cleanup "Build failed (npm run build). Scroll up for Next.js / TypeScript errors."
            fi

            if [ ! -d ".next" ]; then
              fail_and_cleanup "Build output missing (.next)"
            fi

            sudo chown -R jenkins:jenkins "${NEW_BUILD_DIR}"
            echo "Build size: $(du -sh .next | cut -f1)"

            echo ""
            echo "Swapping release..."
            pm2 delete "${PM2_APP_NAME}" 2>/dev/null || true

            safe_rm "${TEMP_OLD}"
            sudo mv "${DEPLOY_DIR}" "${TEMP_OLD}" 2>/dev/null || true
            sudo mv "${NEW_BUILD_DIR}" "${DEPLOY_DIR}"
            sudo chown -R jenkins:jenkins "${DEPLOY_DIR}"

            cd "${DEPLOY_DIR}"
            export PORT="${APP_PORT}"
            # next start defaults to 3000 unless -p / PORT is set; health check uses APP_PORT.
            pm2 start npm --name "${PM2_APP_NAME}" --update-env -- start -- -p "${APP_PORT}"
            pm2 save

            echo ""
            echo "Health check..."
            sleep 15

            HEALTH_OK=false
            HTTP_CODE="000"

            if pm2 describe "${PM2_APP_NAME}" | grep -q "status.*online"; then
              sleep 10
              if pm2 describe "${PM2_APP_NAME}" | grep -q "status.*online"; then
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${APP_PORT}/" || echo "000")
                case "${HTTP_CODE}" in
                  2*|3*) HEALTH_OK=true ;;
                esac
              fi
            fi

            if [ "${HEALTH_OK}" = false ]; then
              echo "::error::Health check failed (PM2 or HTTP ${HTTP_CODE} on port ${APP_PORT})"
              pm2 logs "${PM2_APP_NAME}" --lines 50 --nostream || true

              if [ -d "${TEMP_OLD}" ]; then
                echo "Rolling back to previous release..."
                pm2 delete "${PM2_APP_NAME}" 2>/dev/null || true
                safe_rm "${DEPLOY_DIR}"
                sudo mv "${TEMP_OLD}" "${DEPLOY_DIR}"
                cd "${DEPLOY_DIR}"
                export PORT="${APP_PORT}"
                pm2 start npm --name "${PM2_APP_NAME}" --update-env -- start -- -p "${APP_PORT}"
                pm2 save
                echo "Rollback complete"
              fi
              exit 1
            fi

            echo ""
            echo "Cleaning up previous release..."
            safe_rm "${TEMP_OLD}"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Deployment successful (HTTP ${HTTP_CODE})"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Time: $(date)"
            pm2 list
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
