name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Placeholder values for compile-time / prerender only — not real secrets.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  MONGODB_URI: mongodb://localhost:27017/vacationsaga-ci
  MONGO_DB_URL: mongodb://localhost:27017/vacationsaga-ci
  TOKEN_SECRET: ci-token-secret-not-for-production-use
  PAYMENT_TOKEN_SECRET: ci-payment-token-secret-not-for-production-use
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_URL: http://localhost:3000
  # Dummy Razorpay keys so `next build` can collect /api/order without crashing.
  RAZORPAY_API_KEY: rzp_test_ci_placeholder_key
  RAZORPAY_APT_SECRET: ci_placeholder_razorpay_secret

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ensures Next image module types exist even if next-env.d.ts is missing.
      - name: Ensure Next.js TypeScript env
        run: |
          if [ ! -f next-env.d.ts ]; then
            printf '%s\n' \
              '/// <reference types="next" />' \
              '/// <reference types="next/image-types/global" />' \
              '' \
              '// NOTE: This file should not be edited' \
              '// see https://nextjs.org/docs/basic-features/typescript for more information.' \
              > next-env.d.ts
          fi

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # Full Next.js production build + VPS publish only for main.
  # On dev we still run TypeScript + ESLint so PRs get checked without a full build.
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/vacationsaga-ci
          MONGO_DB_URL: mongodb://localhost:27017/vacationsaga-ci
          TOKEN_SECRET: ci-token-secret-not-for-production-use
          PAYMENT_TOKEN_SECRET: ci-payment-token-secret-not-for-production-use
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_URL: http://localhost:3000
          RAZORPAY_API_KEY: rzp_test_ci_placeholder_key
          RAZORPAY_APT_SECRET: ci_placeholder_razorpay_secret
